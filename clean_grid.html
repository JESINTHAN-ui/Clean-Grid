            className: 'clean-grid-tile-layer'
          }).addTo(map);

          mapInstanceRef.current = map;
        }

        map.eachLayer((layer) => {
          if (!layer._url) map.removeLayer(layer);
        });

          {/* ROOT CAUSE MODAL */}
          {activeHotspot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="glass-panel-glow rounded-2xl p-6 max-w-lg w-full text-slate-100">
                <div className="flex justify-between items-start border-b border-slate-800 pb-3 mb-4">
                  <div>
                    <span className="text-xs font-mono uppercase text-rose-400 font-bold">CRITICAL BOTTLENECK ANALYSIS</span>
                    <h3 className="text-xl font-bold font-display text-white">{activeHotspot.name}</h3>
                    <p className="text-xs font-mono text-slate-400">Current Delay: {activeHotspot.delay} &bull; Speed: {activeHotspot.speed}</p>
                  </div>
                  <button onClick={() => setActiveHotspot(null)} className="p-1 rounded bg-slate-800 text-slate-400">✕</button>
                </div>

                <div className="space-y-2 mb-4 text-xs font-mono">
                  <div className="flex justify-between"><span>Parking Spillover:</span><b>{activeHotspot.factors.parking}%</b></div>
                  <div className="flex justify-between"><span>Bus Stop Crowding:</span><b>{activeHotspot.factors.bus}%</b></div>
                  <div className="flex justify-between"><span>Auto Pickup Clustering:</span><b>{activeHotspot.factors.auto}%</b></div>
                </div>

                <div className="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/40 text-xs mb-4">
                  <span className="font-bold text-emerald-300 block mb-1">Clean Grid AI Intervention:</span>
                  <p className="text-slate-200">{activeHotspot.intervention}</p>
                </div>

                <button onClick={() => setActiveHotspot(null)} className="w-full py-2.5 rounded-xl bg-cyan-600 text-slate-950 font-bold text-xs">
                  DISMISS ROOT CAUSE
                </button>
              </div>
            </div>
          )}

          {/* QR VERIFICATION MODAL */}
          {qrModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-panel-glow rounded-2xl p-6 max-w-md w-full text-slate-100 text-center">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                  <h3 className="text-base font-bold font-display text-white">Transit Verification</h3>
                  <button onClick={() => setQrModalOpen(false)} className="p-1 rounded bg-slate-800 text-slate-400">✕</button>
                </div>

                {!verifiedSuccess ? (
                  <div>
                    <div className="w-full h-48 rounded-2xl bg-slate-950 border border-cyan-500/40 flex flex-col items-center justify-center mb-4 relative overflow-hidden">
                      <div className="text-4xl mb-2">📱</div>
                      <span className="text-xs font-mono text-slate-300">Align Metro Turnstile QR / Bus Ticket</span>
                      <div className="text-[10px] font-mono text-slate-500 mt-2">Anna Salai Blue Line Turnstile Gate</div>
                    </div>

                    <button
                      onClick={handleScanQR}
                      disabled={verifying}
                      className="w-full py-3 rounded-xl font-display font-bold text-xs uppercase tracking-wider bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 shadow-lg shadow-cyan-500/30"
                    >
                      {verifying ? 'VERIFYING CRYPTOGRAPHIC PROOF...' : '⚡ SCAN DEMO CLEAN GRID QR'}
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4 py-2">
                    <div className="text-4xl">🎉</div>
                    <h4 className="text-xl font-bold font-display text-white">+28 Clean Grid Credits Awarded!</h4>
                    <p className="text-xs text-slate-300">Your low-emission choice eliminated <b>3.0 kg CO2</b> today.</p>
                    <div className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-mono text-left space-y-1">
                      <div className="text-emerald-400">✔ Cryptographic Key Signature: VALID</div>
                      <div className="text-emerald-400">✔ Geofence Entry Gate: MATCHED</div>
                      <div className="text-emerald-400">✔ Zero-Emission Verification: PASSED</div>
                    </div>
                    <button
                      onClick={() => setQrModalOpen(false)}
                      className="w-full py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs"
                    >
                      DONE &bull; RETURN
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* WALLET MODAL */}
          {walletModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-panel-glow rounded-2xl p-6 max-w-lg w-full text-slate-100">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                  <h3 className="text-lg font-bold font-display text-white">Clean Grid Credits Wallet</h3>
                  <button onClick={() => setWalletModalOpen(false)} className="p-1 rounded bg-slate-800 text-slate-400">✕</button>
                </div>
                <div className="p-4 rounded-xl bg-cyan-950/50 border border-cyan-500/30 mb-4">
                  <span className="text-xs text-slate-400 font-mono uppercase">Balance</span>
                  <div className="text-3xl font-black font-display text-cyan-300 mt-1">{walletBalance} Credits</div>
                </div>
                <div className="space-y-2 mb-4 text-xs">
                  <div className="p-3 rounded-xl bg-slate-900 border border-slate-800 flex justify-between items-center">
                    <div><b>Free Metro Feeder Shuttle Pass</b><div className="text-slate-400">50 Credits</div></div>
                    <button onClick={() => { setWalletBalance(b => b - 50); showToast("Voucher saved!"); }} className="px-3 py-1 bg-cyan-600 text-slate-950 font-bold rounded">REDEEM</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* HOW IT WORKS MODAL */}
          {howItWorksOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-panel-glow rounded-2xl p-6 max-w-2xl w-full text-slate-100 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                  <h3 className="text-xl font-bold font-display text-white">HOW CLEAN GRID WORKS</h3>
                  <button onClick={() => setHowItWorksOpen(false)} className="p-1 rounded bg-slate-800 text-slate-400">✕</button>
                </div>
                <div className="space-y-3 text-xs leading-relaxed text-slate-300">
                  <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                    <b className="text-cyan-400 block mb-1">1. OBSERVE &amp; PREDICT</b>
                    Aggregates telemetry across Chennai Metro, MTC buses, autos, and 6 competing delivery fleets to forecast gridlock 20 minutes early.
                  </div>
                  <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                    <b className="text-emerald-400 block mb-1">2. COORDINATE &amp; CONSOLIDATE</b>
                    Routes commuters to high-capacity multimodal transit while merging parallel delivery orders into shared e-cargo routes with AI cost splits.
                  </div>
                  <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                    <b className="text-purple-400 block mb-1">3. VERIFY &amp; REWARD</b>
                    Validates low-emission choices with zero-knowledge transit credentials and awards Clean Grid Credits.
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="w-full border-t border-cyan-500/10 bg-[#04060c] py-4 px-4 text-center text-xs text-slate-500 font-mono mt-8">
            Clean Grid &bull; India's Adaptive Mobility &amp; Logistics Coordination Layer &bull; <SimBadge text="SIMULATED CHENNAI PROTOTYPE" size="xs" />
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
